<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Mastery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Memory Match</h1>
            <div class="stats">
                <div class="stat-item">Score: <span id="score">0</span></div>
                <div class="stat-item">Moves: <span id="moves">0</span></div>
                <div class="stat-item">Time: <span id="timer">00:00</span></div>
            </div>
            <div class="controls">
                <select id="level-select">
                    <option value="easy">Easy (4x4)</option>
                    <option value="medium">Medium (6x4)</option>
                    <option value="hard">Hard (6x6)</option>
                </select>
                <button id="reset-btn">New Game</button>
            </div>
        </header>

        <main id="game-board" class="game-board easy">
            <!-- Cards will be dynamically generated here -->
        </main>

        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Congratulations!</h2>
                <p>You matched all pairs!</p>
                <div class="final-stats">
                    <p>Final Score: <span id="final-score">0</span></p>
                    <p>Total Moves: <span id="final-moves">0</span></p>
                    <p>Time: <span id="final-time">00:00</span></p>
                </div>
                <button id="play-again-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="js/sounds.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
